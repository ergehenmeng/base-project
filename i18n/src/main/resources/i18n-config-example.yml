# ============================================
# 国际化模块配置示例
# ============================================

eghm:
  i18n:
    # 是否启用国际化模块 (默认true, 设为false则完全禁用)
    enabled: true
    
    # 默认语言 (当请求未指定语言或指定语言不支持时使用)
    default-language: zh_CN
    
    # 请求头名称 (用于传递语言标识)
    header-name: X-Language
    
    # 备用请求头名称 (当主请求头未设置时使用)
    fallback-header-name: Accept-Language
    
    # 支持的语言列表 (可自由扩展, 不写死)
    supported-languages:
      zh_CN:
        code: zh_CN
        name: 简体中文
        icon: 🇨🇳
        enabled: true
      en_US:
        code: en_US
        name: English
        icon: 🇺🇸
        enabled: true
      ja_JP:
        code: ja_JP
        name: 日本語
        icon: 🇯🇵
        enabled: true
      ko_KR:
        code: ko_KR
        name: 한국어
        icon: 🇰🇷
        enabled: true
      # 可以继续添加其他语言
      # fr_FR:
      #   code: fr_FR
      #   name: Français
      #   icon: 🇫🇷
      #   enabled: true
      # de_DE:
      #   code: de_DE
      #   name: Deutsch
      #   icon: 🇩🇪
      #   enabled: true
